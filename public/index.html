<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Exam Prep</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f8f6;
      color: #444;
      font-size: 14px;
      line-height: 1.7;
    }
    .container { display: flex; min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      background: #fff;
      border-right: 0.5px solid #e0e0e0;
      padding: 2rem 0;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-logo {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #999;
      padding: 0 1.5rem;
      margin-bottom: 1.75rem;
    }
    .nav-link {
      display: block;
      padding: 0.75rem 1.5rem;
      color: #444;
      text-decoration: none;
      cursor: pointer;
      border-left: 2px solid transparent;
      font-size: 13px;
      transition: all 0.15s;
    }
    .nav-link:hover { background: #f8f8f6; color: #1a1a1a; }
    .nav-link.active {
      border-left-color: #1a1a1a;
      background: #f8f8f6;
      color: #1a1a1a;
      font-weight: 500;
    }

    /* ── Main area ── */
    .main { margin-left: 220px; flex: 1; padding: 2.5rem 2.5rem 4rem; max-width: 900px; }
    .page { display: none; }
    .page.active { display: block; }
    h1 { font-size: 26px; font-weight: 500; color: #1a1a1a; margin-bottom: 0.375rem; letter-spacing: -0.3px; }
    .page-subtitle { font-size: 13px; color: #999; margin-bottom: 2rem; }
    h2 { font-size: 17px; font-weight: 500; color: #1a1a1a; margin-bottom: 1.25rem; }

    /* ── Cards ── */
    .card {
      background: #fff;
      border: 0.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 1.25rem;
    }

    /* ── Form elements ── */
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: #999; margin-bottom: 0.5rem; }
    select {
      width: 100%;
      height: 40px;
      padding: 0 0.75rem;
      border: 0.5px solid #d0d0d0;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      background: #fff;
      color: #1a1a1a;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: #1a1a1a; }
    .slider-container { display: flex; align-items: center; gap: 1rem; }
    input[type="range"] {
      flex: 1;
      height: 3px;
      -webkit-appearance: none;
      appearance: none;
      background: #e8e8e6;
      outline: none;
      border: none;
      border-radius: 2px;
      padding: 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      background: #1a1a1a;
      border-radius: 50%;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px;
      background: #1a1a1a;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    .slider-value { min-width: 28px; text-align: center; font-weight: 600; font-size: 13px; color: #1a1a1a; }

    /* ── Buttons ── */
    button {
      height: 40px;
      padding: 0 1.25rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      transition: background 0.15s;
    }
    button:hover { background: #333; }
    button:active { background: #000; }

    /* ── Progress bar ── */
    .progress-bar { height: 3px; background: #f0f0ee; border-radius: 2px; margin-bottom: 2rem; overflow: hidden; }
    .progress { height: 100%; background: #1a1a1a; transition: width 0.3s; }
    .progress-label { font-size: 12px; color: #999; margin-bottom: 0.5rem; }

    /* ── Quiz question ── */
    .question-container { margin-bottom: 1.5rem; }
    .question-text { font-size: 16px; font-weight: 500; color: #1a1a1a; margin-bottom: 1.25rem; line-height: 1.55; }
    .choices { display: flex; flex-direction: column; gap: 0.625rem; }
    .choice {
      padding: 0.875rem 1rem;
      border: 0.5px solid #d8d8d6;
      border-radius: 6px;
      cursor: pointer;
      background: #fff;
      font-size: 13px;
      color: #1a1a1a;
      transition: border-color 0.15s, background 0.15s;
    }
    .choice:hover { border-color: #1a1a1a; background: #fafaf8; }
    .choice.correct { background: #f0faf1; border-color: #2e7d32; color: #1a4d1e; }
    .choice.incorrect { background: #fff5f5; border-color: #c62828; color: #7a1a1a; }
    .choice.disabled { cursor: not-allowed; }
    .explanation {
      margin-top: 1rem;
      padding: 0.875rem 1rem;
      background: #fafaf8;
      border-left: 2px solid #1a1a1a;
      border-radius: 0 4px 4px 0;
      font-size: 13px;
      line-height: 1.6;
      color: #444;
    }

    /* ── Results ── */
    .results-screen { text-align: center; padding: 1rem 0; }
    .grade { font-size: 56px; font-weight: 300; color: #1a1a1a; letter-spacing: -2px; margin-bottom: 0.25rem; }
    .score-display { font-size: 18px; color: #666; margin-bottom: 2rem; }
    .review-section { margin-top: 2rem; text-align: left; }
    .review-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #999; margin-bottom: 1rem; }
    .review-item {
      margin-bottom: 1rem;
      padding: 1.25rem;
      border: 0.5px solid #e8e8e6;
      border-radius: 8px;
      background: #fff;
    }
    .review-question { font-weight: 500; color: #1a1a1a; margin-bottom: 0.625rem; font-size: 13px; }
    .review-answer { font-size: 13px; margin: 0.3rem 0; }
    .correct-answer { color: #2e7d32; font-weight: 500; }
    .your-answer { color: #c62828; }
    .review-topic { font-size: 11px; color: #aaa; margin-top: 0.5rem; }

    /* ── Topic filter buttons ── */
    .topic-filters { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .topic-btn {
      height: 34px;
      padding: 0 1rem;
      border: 0.5px solid #d0d0d0;
      border-radius: 6px;
      background: #fff;
      color: #444;
      cursor: pointer;
      font-size: 13px;
      font-weight: 400;
      font-family: inherit;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .topic-btn:hover { border-color: #1a1a1a; color: #1a1a1a; }
    .topic-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    /* ── Mode tabs ── */
    .mode-tabs { display: flex; border-bottom: 0.5px solid #e0e0e0; margin-bottom: 1.75rem; gap: 0; }
    .mode-tab {
      padding: 0.625rem 1.25rem;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      color: #888;
      font-weight: 400;
      transition: all 0.15s;
      height: auto;
      border-radius: 0;
    }
    .mode-tab:hover { color: #1a1a1a; background: transparent; }
    .mode-tab.active { border-bottom-color: #1a1a1a; color: #1a1a1a; font-weight: 500; }
    .study-content { display: none; }
    .study-content.active { display: block; }

    /* ── Topic section label ── */
    .topic-section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #aaa;
      margin: 2rem 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 0.5px solid #f0f0ee;
    }
    .topic-section-label:first-child { margin-top: 0; }

    /* ── Summary concept cards ── */
    .concept-grid { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1rem; }
    .concept-card {
      background: #fff;
      border: 0.5px solid #e8e8e6;
      border-radius: 8px;
      padding: 20px 22px;
    }
    .concept-card-title { font-size: 15px; font-weight: 500; color: #1a1a1a; margin-bottom: 0.375rem; }
    .concept-card-def { font-size: 13px; color: #555; line-height: 1.65; margin-bottom: 0.75rem; }
    .concept-card-bullets { list-style: none; padding: 0; margin: 0; }
    .concept-card-bullets li {
      font-size: 13px;
      color: #555;
      padding: 0.2rem 0 0.2rem 1rem;
      position: relative;
      line-height: 1.55;
    }
    .concept-card-bullets li::before { content: '–'; position: absolute; left: 0; color: #ccc; }

    /* ── Flashcards ── */
    .flashcard-grid { display: flex; flex-direction: column; gap: 1.25rem; }
    .flashcard-wrapper { cursor: pointer; }
    .flashcard {
      background: #fff;
      border: 0.5px solid #e0e0e0;
      border-radius: 8px;
      min-height: 160px;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: box-shadow 0.15s;
    }
    .flashcard:hover { border-color: #1a1a1a; }
    .flashcard-inner {
      width: 100%;
      position: relative;
      transition: opacity 0.25s;
    }
    .flashcard-front-text { font-size: 15px; font-weight: 500; color: #1a1a1a; }
    .flashcard-back-text { font-size: 14px; color: #444; line-height: 1.6; display: none; }
    .flashcard.flipped .flashcard-front-text { display: none; }
    .flashcard.flipped .flashcard-back-text { display: block; }
    .flashcard-hint { font-size: 11px; color: #bbb; text-align: center; margin-top: 0.5rem; }

    /* ── Outline ── */
    .outline-item { margin-bottom: 0.625rem; }
    .section-header {
      cursor: pointer;
      padding: 0.875rem 1rem;
      background: #fafaf8;
      border: 0.5px solid #e8e8e6;
      border-radius: 6px;
      font-weight: 500;
      font-size: 13px;
      color: #1a1a1a;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-header::after { content: '▾'; font-size: 14px; color: #aaa; transition: transform 0.2s; }
    .section-header.collapsed::after { transform: rotate(-90deg); }
    .section-content {
      padding: 1rem 1rem 1rem 1.25rem;
      border: 0.5px solid #e8e8e6;
      border-top: none;
      border-radius: 0 0 6px 6px;
      margin-bottom: 0;
      font-size: 13px;
      line-height: 1.7;
      color: #555;
    }
    .section-content.hidden { display: none; }

    /* ── Scenarios ── */
    .scenario-box {
      background: #fff;
      border: 0.5px solid #e8e8e6;
      border-radius: 8px;
      padding: 20px 22px;
      margin-bottom: 1rem;
    }
    .scenario-title { font-size: 15px; font-weight: 500; color: #1a1a1a; margin-bottom: 0.625rem; }
    .scenario-description { font-size: 13px; color: #666; line-height: 1.65; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 0.5px solid #f0f0ee; }
    .scenario-concept { margin-bottom: 0.5rem; font-size: 13px; color: #444; }
    .concept-tag { font-weight: 600; color: #1a1a1a; }

    /* ── Misc ── */
    .loading { text-align: center; padding: 3rem 2rem; color: #999; font-size: 13px; }
    .spinner {
      border: 2px solid #f0f0ee;
      border-top-color: #1a1a1a;
      border-radius: 50%;
      width: 32px; height: 32px;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      background: #fff5f5;
      border: 0.5px solid #f5c0c0;
      border-radius: 6px;
      padding: 0.875rem 1rem;
      margin-bottom: 1rem;
      color: #c62828;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="sidebar-title">Navigation</div>
      <a class="nav-link active" data-page="quiz">Quiz generator</a>
      <a class="nav-link" data-page="study">Study guide</a>
    </div>

    <div class="main">
      <!-- Quiz Page -->
      <div id="quiz" class="page active">
        <h1>Quiz generator</h1>
        <div class="card">
          <div id="quizError" class="error" style="display: none;"></div>

          <div id="quizSetup">
            <div class="form-group">
              <label>Topic</label>
              <select id="topic">
                <option>All Topics</option>
                <option>Consumer Behavior</option>
                <option>Product Management</option>
                <option>Marketing Research</option>
              </select>
            </div>

            <div class="form-group">
              <label>Difficulty</label>
              <select id="difficulty">
                <option>Easy</option>
                <option>Medium</option>
                <option>Hard</option>
              </select>
            </div>

            <div class="form-group">
              <label>Number of questions</label>
              <div class="slider-container">
                <input type="range" id="count" min="3" max="15" value="5">
                <span class="slider-value" id="countValue">5</span>
              </div>
            </div>

            <button id="generateBtn" onclick="generateQuiz()">Generate quiz</button>
          </div>

          <div id="quizContent" style="display: none;">
            <div class="progress-bar">
              <div class="progress" id="progressBar" style="width: 0%;"></div>
            </div>

            <div id="questionArea"></div>

            <div id="resultsScreen" style="display: none;" class="results-screen">
              <h2>Quiz complete</h2>
              <div class="grade" id="gradeDisplay"></div>
              <div class="score-display" id="scoreDisplay"></div>
              <button onclick="resetQuiz()">Start another quiz</button>
              <div class="review-section" id="reviewSection"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Study Guide Page -->
      <div id="study" class="page">
        <h1>Study guide</h1>
        <div class="card">
          <div class="topic-filters">
            <button class="topic-btn active" data-topic="all">All topics</button>
            <button class="topic-btn" data-topic="Consumer Behavior">Consumer behavior</button>
            <button class="topic-btn" data-topic="Product Management">Product management</button>
            <button class="topic-btn" data-topic="Marketing Research">Marketing research</button>
          </div>

          <div class="mode-tabs">
            <button class="mode-tab active" data-mode="summary">Summary</button>
            <button class="mode-tab" data-mode="flashcards">Flashcards</button>
            <button class="mode-tab" data-mode="outline">Outline</button>
            <button class="mode-tab" data-mode="scenarios">Scenarios</button>
          </div>

          <div id="summary" class="study-content active"></div>
          <div id="flashcards" class="study-content"></div>
          <div id="outline" class="study-content"></div>
          <div id="scenarios" class="study-content"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const studyData = {
      'Consumer Behavior': {
        summary: [
          { name: 'Consumer decision process', definition: 'The five-step journey a consumer takes from identifying a need through evaluating the purchase.', bullets: ['Problem recognition — consumer identifies a need or gap', 'Information search — seeking knowledge about solutions', 'Alternative evaluation — comparing options against criteria', 'Outlet selection — choosing where to buy', 'Postpurchase behavior — satisfaction, loyalty, or dissonance'] },
          { name: 'Perception', definition: 'How consumers select, organize, and interpret sensory information to form a meaningful picture of the world.', bullets: ['Selective exposure — choosing what to notice', 'Selective attention — focusing on relevant stimuli', 'Selective distortion — interpreting info to fit existing beliefs', 'Selective retention — remembering information that supports attitudes', 'JND / Weber\'s Law — minimum change required for a consumer to notice a difference'] },
          { name: 'Learning', definition: 'Changes in behavior resulting from experience, information, or repeated exposure.', bullets: ['Classical conditioning — pairing a neutral stimulus with an unconditioned one (Pavlov)', 'Operant conditioning — reinforcement and punishment shape future behavior'] },
          { name: "Maslow's hierarchy of needs", definition: 'A motivational model ranking human needs from basic survival to self-fulfillment; lower levels must be satisfied first.', bullets: ['1. Physiological — food, water, shelter', '2. Safety — security, stability', '3. Social — belonging, love, community', '4. Esteem — status, recognition, achievement', '5. Self-actualization — realizing full potential'] },
          { name: 'Attitudes', definition: 'Learned predispositions to respond in a consistently favorable or unfavorable way toward a person, object, or idea.', bullets: ['Cognitive component — beliefs and knowledge about the object', 'Affective component — feelings and emotions', 'Behavioral component — action tendencies and intentions (ABC model)'] },
          { name: 'Social & external influences', definition: 'Outside forces from culture, groups, and family that shape what consumers buy and why.', bullets: ['Culture — shared values and norms of a society', 'Subcultures — distinct groups within a broader culture', 'Reference groups — informational (data), normative (social pressure), identification (aspirational)', 'Family roles: initiator, influencer, decider, purchaser, user'] },
          { name: 'Key decision concepts', definition: 'Additional factors that affect how consumers make and feel about choices.', bullets: ['Evoked set — the brands a consumer actively considers', 'High involvement — deliberate, effortful decision-making', 'Low involvement — automatic, habitual decisions', 'Cognitive dissonance — post-purchase doubt or regret', 'Hedonic needs — pleasure-seeking and emotional satisfaction', 'Utilitarian needs — functional, problem-solving purchases'] },
        ],

        flashcards: [
          { front: 'What are the five steps of the consumer decision process?', back: 'Problem recognition → Information search → Alternative evaluation → Outlet selection → Postpurchase behavior' },
          { front: 'Define selective attention.', back: 'The consumer\'s tendency to focus only on stimuli relevant to their needs, filtering out irrelevant information.' },
          { front: 'What is classical conditioning?', back: 'Learning through pairing a neutral stimulus with an unconditioned stimulus to create a conditioned response (e.g., Pavlov\'s dogs).' },
          { front: 'Name Maslow\'s five levels of needs.', back: 'Physiological → Safety → Social → Esteem → Self-actualization' },
          { front: 'What are the three components of attitudes?', back: 'Cognitive (beliefs), affective (feelings), behavioral (actions)' },
          { front: 'Define reference groups.', back: 'Groups that individuals use as standards to evaluate their own beliefs, values, and behavior.' },
          { front: 'What is cognitive dissonance?', back: 'Post-purchase doubt or discomfort when a consumer questions whether they made the right decision.' },
          { front: 'Distinguish hedonic from utilitarian needs.', back: 'Hedonic = pleasure-seeking (emotional); Utilitarian = functional, problem-solving (rational)' }
        ],

        outline: [
          {
            title: 'Consumer Decision Process (5 Steps)',
            content: '1. Problem Recognition: Consumer identifies a need or gap\n2. Information Search: Seeking knowledge about solutions\n3. Alternative Evaluation: Comparing options against criteria\n4. Outlet Selection: Choosing where to purchase\n5. Postpurchase Behavior: Evaluating satisfaction, loyalty'
          },
          {
            title: 'Internal Influences',
            content: 'Perception: Selective exposure, attention, distortion, retention; JND/Weber\'s Law\nLearning: Classical conditioning, operant conditioning\nMotivation: Maslow\'s hierarchy (physiological, safety, social, esteem, self-actualization)\nAttitudes: Cognitive/affective/behavioral components (ABC model)'
          },
          {
            title: 'External Influences',
            content: 'Culture: Shared values and norms\nSubcultures: Distinct groups within culture\nReference Groups: Provide informational, normative, identification influence\nFamily Roles: Initiator, influencer, decider, purchaser, user'
          },
          {
            title: 'Key Concepts',
            content: 'Evoked Set: Brands under consideration\nInvolvement: High (deliberate) vs. low (automatic)\nCognitive Dissonance: Post-purchase doubt\nHedonic vs. Utilitarian: Pleasure vs. function'
          }
        ],

        scenarios: [
          {
            title: 'Buying Your First Car',
            scenario: 'You need reliable transportation. You search online, read reviews, visit dealerships, compare models, and finally buy a Toyota. Days later, you wonder if you should have chosen Honda instead.',
            concepts: [
              { concept: 'Problem Recognition', explanation: 'You identified the need for transportation.' },
              { concept: 'Information Search', explanation: 'Online research, reviews, and dealership visits.' },
              { concept: 'Alternative Evaluation', explanation: 'Comparing Toyota, Honda, Ford across price, reliability, features.' },
              { concept: 'Cognitive Dissonance', explanation: 'Post-purchase doubt about choosing Toyota over Honda.' }
            ]
          },
          {
            title: 'Luxury Watch Purchase',
            scenario: 'A successful executive buys a Rolex to signal status to peers and feel accomplished.',
            concepts: [
              { concept: 'Esteem Needs', explanation: 'Maslow level: achieving status and recognition.' },
              { concept: 'Reference Group Influence', explanation: 'Peers set the standard for luxury watches.' },
              { concept: 'Hedonic Need', explanation: 'Pleasure and emotional satisfaction from owning prestige brand.' }
            ]
          }
        ]
      },

      'Product Management': {
        summary: [
          { name: 'Four service characteristics', definition: 'Unique properties that distinguish services from physical products, each requiring a distinct management response.', bullets: ['Intangibility — cannot be seen, touched, or tested before purchase', 'Inseparability — production and consumption occur simultaneously', 'Heterogeneity — quality varies person to person; fix with training and standardization', 'Perishability — cannot be stored or inventoried; fix with capacity management'] },
          { name: 'Product line depth', definition: 'The number of variants within a single product category. Companies deliberately reduce depth to sharpen focus.', bullets: ['Reduces consumer confusion from too many similar choices', 'Preserves retail shelf space for top performers', 'Simplifies supply chain and procurement', 'Reduces manufacturing complexity and cost', 'Concentrates resources on high-margin products'] },
          { name: 'Product mix, SKUs & cannibalization', definition: 'The architecture of a company\'s full product portfolio and the risks of overlap within it.', bullets: ['Product mix width — number of distinct product categories offered', 'SKU (stock-keeping unit) — unique identifier for each individual product variant', 'Cannibalization — when a new product steals sales from an existing one in the same portfolio'] },
          { name: 'Product life cycle', definition: 'The four stages a product passes through from market entry to eventual exit.', bullets: ['Introduction — slow sales, high costs, limited awareness', 'Growth — rapid sales increase, new competitors enter, economies of scale', 'Maturity — peak sales, intense competition, price pressure, market saturation', 'Decline — falling sales, reduced investment, product phase-out'] },
          { name: 'New product development (7 stages)', definition: 'A structured process for bringing new products to market while filtering out weak ideas early.', bullets: ['1. Strategy — define mission and objectives', '2. Idea generation — brainstorming and sourcing new concepts', '3. Idea screening — eliminate poor or risky ideas early', '4. Business analysis — financial projections and feasibility', '5. Development — build and test a prototype', '6. Test marketing — limited geographic launch to assess response', '7. Commercialization — full-scale market launch'] },
          { name: 'Brand equity & packaging', definition: 'The added value a strong brand brings, and the role packaging plays in delivering it at point of sale.', bullets: ['Brand awareness — recognition and recall in the consumer\'s mind', 'Brand associations — mental connections and emotional meaning', 'Perceived quality — consumer\'s subjective assessment of superiority', 'Brand loyalty — consistent repeat purchase behavior', 'Packaging functions: protection, communication, convenience, promotion'] },
        ],

        flashcards: [
          { front: 'Define intangibility in services.', back: 'Services cannot be seen, touched, tasted, or held before purchase.' },
          { front: 'How do companies address heterogeneity in services?', back: 'Through standardization, employee training, and quality control procedures.' },
          { front: 'What is the solution to service perishability?', back: 'Capacity management (adjust supply to demand) and demand forecasting.' },
          { front: 'Why do companies reduce product line depth?', back: 'To reduce confusion, save shelf space, simplify supply chains, reduce complexity, focus on high-margin products.' },
          { front: 'What is cannibalization?', back: 'When one product steals sales from another product in the same company\'s portfolio.' },
          { front: 'Name the four stages of the product life cycle.', back: 'Introduction → Growth → Maturity → Decline' },
          { front: 'What happens during the test marketing stage?', back: 'The product is launched in a limited geographic market to assess consumer response before full commercialization.' },

          { name: 'Quantitative research methods', definition: 'Numerical methods that measure "how many" and "how much," enabling statistical analysis and generalization.', bullets: ['Surveys — structured questionnaires administered at scale', 'Experiments — controlled tests that establish cause-and-effect', 'A/B testing — comparing two versions to identify the better performer'] },

          },

        scenarios: [
          {

              { concept: 'Symptom vs. Root Cause', explanation: 'Declining sales (symptom) was caused by operational inefficiencies (root cause), not menu fatigue.' },

            ]
          },
          {
            title: 'New Smartphone Feature Testing',
            scenario: 'A tech company wants to test two designs for a camera interface—Option A (button in corner) vs. Option B (gesture-based). They conduct an A/B test with 10,000 users split 50/50, measuring task completion time and satisfaction.',

              { concept: 'A/B Testing', explanation: 'Comparing two versions to determine which performs better.' },

    };

    // Quiz Logic
    let currentQuiz = null;
    let currentQuestion = 0;
    let score = 0;
    let userAnswers = [];

    document.getElementById('count').addEventListener('input', (e) => {
      document.getElementById('countValue').textContent = e.target.value;
    });

    async function generateQuiz() {
      const topic = document.getElementById('topic').value;
      const difficulty = document.getElementById('difficulty').value;
      const count = document.getElementById('count').value;

      document.getElementById('quizSetup').style.display = 'none';
      document.getElementById('quizContent').style.display = 'block';
      document.getElementById('quizError').style.display = 'none';
      document.getElementById('questionArea').innerHTML = '<div class="loading"><div class="spinner"></div><p>Generating questions...</p></div>';

      try {
        const response = await fetch('/api/quiz', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic, difficulty, count })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || 'Failed to generate quiz');
        }

        const data = await response.json();
        currentQuiz = data.questions;
        currentQuestion = 0;
        score = 0;
        userAnswers = [];
        showQuestion();
      } catch (err) {
        document.getElementById('quizError').textContent = 'Error: ' + err.message;
        document.getElementById('quizError').style.display = 'block';
        document.getElementById('quizSetup').style.display = 'block';
        document.getElementById('quizContent').style.display = 'none';
      }
    }

    function showQuestion() {
      if (!currentQuiz || currentQuestion >= currentQuiz.length) {
        showResults();
        return;
      }

      const q = currentQuiz[currentQuestion];
      const progress = ((currentQuestion + 1) / currentQuiz.length) * 100;
      document.getElementById('progressBar').style.width = progress + '%';

      let html = `
        <h2>Question ${currentQuestion + 1} of ${currentQuiz.length}</h2>
        <div class="question-container">
          <div class="question-text">${q.question}</div>
          <div class="choices">
      `;

      for (const [key, choice] of Object.entries(q.choices)) {
        html += `<div class="choice" onclick="selectAnswer('${key}')" data-choice="${key}">${key}. ${choice}</div>`;
      }

      html += `</div></div><div id="explanation" style="display: none;"></div>`;
      document.getElementById('questionArea').innerHTML = html;
    }

    function selectAnswer(choice) {
      const q = currentQuiz[currentQuestion];
      const isCorrect = choice === q.correct;

      if (isCorrect) score++;
      userAnswers.push({ question: q.question, userAnswer: choice, correct: q.correct, isCorrect, explanation: q.explanation, topic: q.topic });

      // Show feedback
      document.querySelectorAll('.choice').forEach(el => {
        el.classList.add('disabled');
        if (el.dataset.choice === q.correct) el.classList.add('correct');
        if (el.dataset.choice === choice && !isCorrect) el.classList.add('incorrect');
      });

      const explDiv = document.getElementById('explanation');
      explDiv.innerHTML = `<strong>${isCorrect ? 'Correct!' : 'Incorrect.'}</strong> ${q.explanation}`;
      explDiv.style.display = 'block';

      setTimeout(() => {
        currentQuestion++;
        showQuestion();
      }, 2500);
    }

    function showResults() {
      document.getElementById('questionArea').style.display = 'none';
      const percentage = (score / currentQuiz.length) * 100;
      let grade = 'F';
      if (percentage >= 90) grade = 'A';
      else if (percentage >= 80) grade = 'B';
      else if (percentage >= 70) grade = 'C';
      else if (percentage >= 60) grade = 'D';

      document.getElementById('gradeDisplay').textContent = grade;
      document.getElementById('scoreDisplay').textContent = `${score}/${currentQuiz.length}`;

      let reviewHtml = '<h3>Review</h3>';
      userAnswers.forEach((a, i) => {
        reviewHtml += `
          <div class="review-item">
            <div class="review-question">${i + 1}. ${a.question}</div>
            <div class="review-answer"><span class="your-answer">Your answer: ${a.userAnswer}</span></div>
            <div class="review-answer"><span class="correct-answer">Correct: ${a.correct}</span></div>
            <div class="review-answer">${a.explanation}</div>
            <div style="font-size: 12px; color: #666; margin-top: 0.5rem;">Topic: ${a.topic}</div>
          </div>
        `;
      });
      document.getElementById('reviewSection').innerHTML = reviewHtml;
      document.getElementById('resultsScreen').style.display = 'block';
    }

    function resetQuiz() {
      currentQuiz = null;
      document.getElementById('questionArea').style.display = 'block';
      document.getElementById('resultsScreen').style.display = 'none';
      document.getElementById('quizContent').style.display = 'none';
      document.getElementById('quizSetup').style.display = 'block';
    }

    // Study Guide Logic
    document.querySelectorAll('.topic-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateStudyContent();
      });
    });

    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        updateStudyContent();
      });
    });

    function updateStudyContent() {
      const activeTopic = document.querySelector('.topic-btn.active').dataset.topic;
      const activeMode = document.querySelector('.mode-tab.active').dataset.mode;

      document.querySelectorAll('.study-content').forEach(el => el.classList.remove('active'));

      let content = '';
      const topicData = activeTopic === 'all' ? null : studyData[activeTopic];

      if (activeMode === 'summary') {
        const renderCards = (cards) => `
          <div class="concept-grid">
            ${cards.map(c => `
              <div class="concept-card">
                <div class="concept-card-title">${c.name}</div>
                <div class="concept-card-def">${c.definition}</div>
                <ul class="concept-card-bullets">
                  ${c.bullets.map(b => `<li>${b}</li>`).join('')}
                </ul>
              </div>`).join('')}
          </div>`;
        if (activeTopic === 'all') {
          content = Object.entries(studyData).map(([topic, data]) =>
            `<div class="topic-section-label">${topic}</div>${renderCards(data.summary)}`
          ).join('');
        } else {
          content = renderCards(topicData.summary);
        }
      } else if (activeMode === 'flashcards') {
        const cards = activeTopic === 'all' ? Object.values(studyData).flatMap(d => d.flashcards) : topicData.flashcards;
        content = `<div class="flashcard-grid">${cards.map((card, i) => `
          <div class="flashcard-wrapper" onclick="flipFlashcard(this)" data-front="${card.front.replace(/"/g,'&quot;')}" data-back="${card.back.replace(/"/g,'&quot;')}">
            <div class="flashcard">
              <div class="flashcard-inner">
                <div class="flashcard-front-text">${card.front}</div>
                <div class="flashcard-back-text">${card.back}</div>
              </div>
            </div>
            <div class="flashcard-hint">Tap to flip</div>
          </div>`).join('')}
        </div>`;
      } else if (activeMode === 'outline') {
        const sections = activeTopic === 'all' ? Object.entries(studyData).flatMap(([topic, data]) => data.outline.map(s => ({ ...s, topic }))) : topicData.outline.map(s => ({ ...s, topic: activeTopic }));
        content = sections.map(section => `
          <div class="section-header">${section.title}</div>
          <div class="section-content"><pre style="white-space: pre-wrap; font-family: inherit;">${section.content}</pre></div>
        `).join('');
      } else if (activeMode === 'scenarios') {
        const scens = activeTopic === 'all' ? Object.values(studyData).flatMap(d => d.scenarios) : topicData.scenarios;
        content = scens.map(s => `
          <div class="scenario-box">
            <div class="scenario-title">${s.title}</div>
            <div class="scenario-description">${s.scenario}</div>
            ${s.concepts.map(c => `<div class="scenario-concept"><span class="concept-tag">${c.concept}:</span> ${c.explanation}</div>`).join('')}
          </div>
        `).join('');
      }

      const contentDiv = document.getElementById(activeMode);
      contentDiv.innerHTML = content;
      contentDiv.classList.add('active');

      // Attach collapse handlers to outline
      if (activeMode === 'outline') {
        document.querySelectorAll('.section-header').forEach(header => {
          header.addEventListener('click', () => {
            header.classList.toggle('collapsed');
            header.nextElementSibling.classList.toggle('hidden');
          });
        });
      }
    }

    function flipFlashcard(wrapper) {
      const card = wrapper.querySelector('.flashcard');
      card.classList.toggle('flipped');
      const hint = wrapper.querySelector('.flashcard-hint');
      hint.textContent = card.classList.contains('flipped') ? 'Tap to flip back' : 'Tap to flip';
    }

    // Navigation
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        link.classList.add('active');
        const pageId = link.dataset.page;
        document.getElementById(pageId).classList.add('active');
        if (pageId === 'study') updateStudyContent();
      });
    });

    // Initialize study content on first load
    updateStudyContent();
  </script>
