<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Exam Prep</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f8f6;
      color: #444;
      font-size: 14px;
      line-height: 1.7;
    }
    .container { display: flex; min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      background: #fff;
      border-right: 0.5px solid #e0e0e0;
      padding: 2rem 0;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-logo {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #999;
      padding: 0 1.5rem;
      margin-bottom: 1.75rem;
    }
    .nav-link {
      display: block;
      padding: 0.75rem 1.5rem;
      color: #444;
      text-decoration: none;
      cursor: pointer;
      border-left: 2px solid transparent;
      font-size: 13px;
      transition: all 0.15s;
    }
    .nav-link:hover { background: #f8f8f6; color: #1a1a1a; }
    .nav-link.active {
      border-left-color: #1a1a1a;
      background: #f8f8f6;
      color: #1a1a1a;
      font-weight: 500;
    }

    /* ── Main area ── */
    .main { margin-left: 220px; flex: 1; padding: 2.5rem 2.5rem 4rem; max-width: 900px; }
    .page { display: none; }
    .page.active { display: block; }
    h1 { font-size: 26px; font-weight: 500; color: #1a1a1a; margin-bottom: 0.375rem; letter-spacing: -0.3px; }
    .page-subtitle { font-size: 13px; color: #999; margin-bottom: 2rem; }
    h2 { font-size: 17px; font-weight: 500; color: #1a1a1a; margin-bottom: 1.25rem; }

    /* ── Cards ── */
    .card {
      background: #fff;
      border: 0.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 1.25rem;
    }

    /* ── Form elements ── */
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: #999; margin-bottom: 0.5rem; }
    select {
      width: 100%;
      height: 40px;
      padding: 0 0.75rem;
      border: 0.5px solid #d0d0d0;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      background: #fff;
      color: #1a1a1a;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: #1a1a1a; }
    .slider-container { display: flex; align-items: center; gap: 1rem; }
    input[type="range"] {
      flex: 1;
      height: 3px;
      -webkit-appearance: none;
      appearance: none;
      background: #e8e8e6;
      outline: none;
      border: none;
      border-radius: 2px;
      padding: 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      background: #1a1a1a;
      border-radius: 50%;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px;
      background: #1a1a1a;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    .slider-value { min-width: 28px; text-align: center; font-weight: 600; font-size: 13px; color: #1a1a1a; }

    /* ── Buttons ── */
    button {
      height: 40px;
      padding: 0 1.25rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      transition: background 0.15s;
    }
    button:hover { background: #333; }
    button:active { background: #000; }

    /* ── Progress bar ── */
    .progress-bar { height: 3px; background: #f0f0ee; border-radius: 2px; margin-bottom: 2rem; overflow: hidden; }
    .progress { height: 100%; background: #1a1a1a; transition: width 0.3s; }
    .progress-label { font-size: 12px; color: #999; margin-bottom: 0.5rem; }

    /* ── Quiz question ── */
    .question-container { margin-bottom: 1.5rem; }
    .question-text { font-size: 16px; font-weight: 500; color: #1a1a1a; margin-bottom: 1.25rem; line-height: 1.55; }
    .choices { display: flex; flex-direction: column; gap: 0.625rem; }
    .choice {
      padding: 0.875rem 1rem;
      border: 0.5px solid #d8d8d6;
      border-radius: 6px;
      cursor: pointer;
      background: #fff;
      font-size: 13px;
      color: #1a1a1a;
      transition: border-color 0.15s, background 0.15s;
    }
    .choice:hover { border-color: #1a1a1a; background: #fafaf8; }
    .choice.correct { background: #f0faf1; border-color: #2e7d32; color: #1a4d1e; }
    .choice.incorrect { background: #fff5f5; border-color: #c62828; color: #7a1a1a; }
    .choice.disabled { cursor: not-allowed; }
    .explanation {
      margin-top: 1rem;
      padding: 0.875rem 1rem;
      background: #fafaf8;
      border-left: 2px solid #1a1a1a;
      border-radius: 0 4px 4px 0;
      font-size: 13px;
      line-height: 1.6;
      color: #444;
    }

    /* ── Results ── */
    .results-screen { text-align: center; padding: 1rem 0; }
    .grade { font-size: 56px; font-weight: 300; color: #1a1a1a; letter-spacing: -2px; margin-bottom: 0.25rem; }
    .score-display { font-size: 18px; color: #666; margin-bottom: 2rem; }
    .review-section { margin-top: 2rem; text-align: left; }
    .review-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #999; margin-bottom: 1rem; }
    .review-item {
      margin-bottom: 1rem;
      padding: 1.25rem;
      border: 0.5px solid #e8e8e6;
      border-radius: 8px;
      background: #fff;
    }
    .review-question { font-weight: 500; color: #1a1a1a; margin-bottom: 0.625rem; font-size: 13px; }
    .review-answer { font-size: 13px; margin: 0.3rem 0; }
    .correct-answer { color: #2e7d32; font-weight: 500; }
    .your-answer { color: #c62828; }
    .review-topic { font-size: 11px; color: #aaa; margin-top: 0.5rem; }

    /* ── Topic filter buttons ── */
    .topic-filters { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .topic-btn {
      height: 34px;
      padding: 0 1rem;
      border: 0.5px solid #d0d0d0;
      border-radius: 6px;
      background: #fff;
      color: #444;
      cursor: pointer;
      font-size: 13px;
      font-weight: 400;
      font-family: inherit;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .topic-btn:hover { border-color: #1a1a1a; color: #1a1a1a; }
    .topic-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    /* ── Mode tabs ── */
    .mode-tabs { display: flex; border-bottom: 0.5px solid #e0e0e0; margin-bottom: 1.75rem; gap: 0; }
    .mode-tab {
      padding: 0.625rem 1.25rem;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      color: #888;
      font-weight: 400;
      transition: all 0.15s;
      height: auto;
      border-radius: 0;
    }
    .mode-tab:hover { color: #1a1a1a; background: transparent; }
    .mode-tab.active { border-bottom-color: #1a1a1a; color: #1a1a1a; font-weight: 500; }
    .study-content { display: none; }
    .study-content.active { display: block; }

    /* ── Topic section label ── */
    .topic-section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #aaa;
      margin: 2rem 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 0.5px solid #f0f0ee;
    }
    .topic-section-label:first-child { margin-top: 0; }

    /* ── Concept cards ── */
    .concept-card-grid { display: flex; flex-direction: column; gap: 16px; margin-bottom: 1.5rem; }
    .concept-card {
      background: #fff;
      border: 0.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px 22px;
    }
    .concept-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 1rem; }
    .concept-card-title { font-size: 15px; font-weight: 500; color: #1a1a1a; }
    .concept-card-tag {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #999;
      white-space: nowrap;
      padding-top: 2px;
    }
    .concept-card-def { font-size: 13px; color: #666; line-height: 1.6; margin-bottom: 12px; }
    .concept-card-bullets { list-style: none; padding: 0; margin: 0; }
    .concept-card-bullets li {
      font-size: 13px;
      color: #444;
      padding: 3px 0 3px 14px;
      position: relative;
      line-height: 1.55;
    }
    .concept-card-bullets li::before { content: '–'; position: absolute; left: 0; color: #bbb; }

    /* ── Flashcards ── */
    .flashcard-grid { display: flex; flex-direction: column; gap: 1.25rem; }
    .flashcard-wrapper { cursor: pointer; }
    .flashcard {
      background: #fff;
      border: 0.5px solid #e0e0e0;
      border-radius: 8px;
      min-height: 160px;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: box-shadow 0.15s;
    }
    .flashcard:hover { border-color: #1a1a1a; }
    .flashcard-inner {
      width: 100%;
      position: relative;
      transition: opacity 0.25s;
    }
    .flashcard-front-text { font-size: 15px; font-weight: 500; color: #1a1a1a; }
    .flashcard-back-text { font-size: 14px; color: #444; line-height: 1.6; display: none; }
    .flashcard.flipped .flashcard-front-text { display: none; }
    .flashcard.flipped .flashcard-back-text { display: block; }
    .flashcard-hint { font-size: 11px; color: #bbb; text-align: center; margin-top: 0.5rem; }

    /* ── Outline ── */
    .outline-item { margin-bottom: 0.625rem; }
    .section-header {
      cursor: pointer;
      padding: 0.875rem 1rem;
      background: #fafaf8;
      border: 0.5px solid #e8e8e6;
      border-radius: 6px;
      font-weight: 500;
      font-size: 13px;
      color: #1a1a1a;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-header::after { content: '▾'; font-size: 14px; color: #aaa; transition: transform 0.2s; }
    .section-header.collapsed::after { transform: rotate(-90deg); }
    .section-content {
      padding: 1rem 1rem 1rem 1.25rem;
      border: 0.5px solid #e8e8e6;
      border-top: none;
      border-radius: 0 0 6px 6px;
      margin-bottom: 0;
      font-size: 13px;
      line-height: 1.7;
      color: #555;
    }
    .section-content.hidden { display: none; }

    /* ── Scenarios ── */
    .scenario-box {
      background: #fff;
      border: 0.5px solid #e8e8e6;
      border-radius: 8px;
      padding: 20px 22px;
      margin-bottom: 1rem;
    }
    .scenario-title { font-size: 15px; font-weight: 500; color: #1a1a1a; margin-bottom: 0.625rem; }
    .scenario-description { font-size: 13px; color: #666; line-height: 1.65; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 0.5px solid #f0f0ee; }
    .scenario-concept { margin-bottom: 0.5rem; font-size: 13px; color: #444; }
    .concept-tag { font-weight: 600; color: #1a1a1a; }

    /* ── Misc ── */
    .loading { text-align: center; padding: 3rem 2rem; color: #999; font-size: 13px; }
    .spinner {
      border: 2px solid #f0f0ee;
      border-top-color: #1a1a1a;
      border-radius: 50%;
      width: 32px; height: 32px;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      background: #fff5f5;
      border: 0.5px solid #f5c0c0;
      border-radius: 6px;
      padding: 0.875rem 1rem;
      margin-bottom: 1rem;
      color: #c62828;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="sidebar-title">Navigation</div>
      <a class="nav-link active" data-page="quiz">Quiz generator</a>
      <a class="nav-link" data-page="study">Study guide</a>
    </div>

    <div class="main">
      <!-- Quiz Page -->
      <div id="quiz" class="page active">
        <h1>Quiz generator</h1>
        <div class="card">
          <div id="quizError" class="error" style="display: none;"></div>

          <div id="quizSetup">
            <div class="form-group">
              <label>Topic</label>
              <select id="topic">
                <option>All Topics</option>
                <option>Consumer Behavior</option>
                <option>Product Management</option>
                <option>Marketing Research</option>
              </select>
            </div>

            <div class="form-group">
              <label>Difficulty</label>
              <select id="difficulty">
                <option>Easy</option>
                <option>Medium</option>
                <option>Hard</option>
              </select>
            </div>

            <div class="form-group">
              <label>Number of questions</label>
              <div class="slider-container">
                <input type="range" id="count" min="3" max="15" value="5">
                <span class="slider-value" id="countValue">5</span>
              </div>
            </div>

            <button id="generateBtn" onclick="generateQuiz()">Generate quiz</button>
          </div>

          <div id="quizContent" style="display: none;">
            <div class="progress-bar">
              <div class="progress" id="progressBar" style="width: 0%;"></div>
            </div>

            <div id="questionArea"></div>

            <div id="resultsScreen" style="display: none;" class="results-screen">
              <h2>Quiz complete</h2>
              <div class="grade" id="gradeDisplay"></div>
              <div class="score-display" id="scoreDisplay"></div>
              <button onclick="resetQuiz()">Start another quiz</button>
              <div class="review-section" id="reviewSection"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Study Guide Page -->
      <div id="study" class="page">
        <h1>Study guide</h1>
        <p class="page-subtitle">Select a topic to filter. Each card covers one testable concept.</p>
        <div class="topic-filters">
          <button class="topic-btn active" data-topic="all">All topics</button>
          <button class="topic-btn" data-topic="cb">Consumer Behavior</button>
          <button class="topic-btn" data-topic="product">Product Management</button>
          <button class="topic-btn" data-topic="research">Marketing Research</button>
        </div>
        <div id="conceptCards"></div>
      </div>
    </div>
  </div>

  <script>
    const concepts = [
      // ── Consumer Behavior ──────────────────────────────────────────
      { topic: 'cb', title: 'Consumer Decision Process', tag: '5 Steps',
        definition: 'The five stages consumers go through from identifying a need to evaluating their purchase.',
        points: [
          'Problem recognition — desired state ≠ actual state (active vs inactive problem)',
          'Information search — internal (memory) vs external (ads, reviews); high knowledge = less search',
          'Alternative evaluation — evaluative criteria, compensatory vs non-compensatory rules, evoked set',
          'Outlet selection &amp; purchase — where, when, and how to buy',
          'Postpurchase — satisfaction, cognitive dissonance, loyalty or switching'
        ]
      },
      { topic: 'cb', title: 'Internal Influences', tag: 'Psychological',
        definition: 'Factors inside the consumer shaping perception and decisions.',
        points: [
          'Perception — selective exposure, attention, distortion, retention',
          'JND &amp; Weber\'s Law — minimum detectable change in a stimulus',
          'Learning — classical conditioning (paired stimuli) and operant conditioning (reinforcement/punishment)',
          'Maslow\'s hierarchy — physiological, safety, social, esteem, self-actualization',
          'Attitudes — cognitive (beliefs) + affective (feelings) + behavioral (action tendency)'
        ]
      },
      { topic: 'cb', title: 'External Influences', tag: 'Social',
        definition: 'Outside forces shaping consumer purchasing decisions.',
        points: [
          'Culture — accumulated values, beliefs, behavioral patterns of a society',
          'Subcultures — teenagers, African American, Southerners, Hispanic, Asian American',
          'Reference groups — informational, normative, identification',
          'Family roles — initiator, influencer, decider, purchaser, user',
          'Social class — upper, middle, working, lower'
        ]
      },
      { topic: 'cb', title: 'Key Concepts', tag: 'Must Know',
        definition: 'High-priority terms tested most frequently.',
        points: [
          'Evoked set — brands that survive information search and are actively considered',
          'Involvement — high (extended problem solving) vs low (routine/habitual)',
          'Cognitive dissonance — post-purchase doubt; reduced by warranties and follow-up',
          'Hedonic vs utilitarian needs — pleasure-driven vs functional',
          'Mood congruence — emotional state at purchase influences decisions'
        ]
      },

      // ── Product Management ─────────────────────────────────────────
      { topic: 'product', title: '4 Service Characteristics', tag: 'Core Concept',
        definition: 'What makes services fundamentally different from goods.',
        points: [
          'Intangibility — cannot be seen or tested before purchase',
          'Inseparability — produced and consumed simultaneously; quality tied to provider',
          'Heterogeneity — variability in delivery; training is the key management solution',
          'Perishability — cannot be stored; idle capacity = permanently lost revenue'
        ]
      },
      { topic: 'product', title: 'Product Line &amp; Mix', tag: 'Structure',
        definition: 'How companies organize their full portfolio.',
        points: [
          'Product line — group of related products by function, customer, or price',
          'Product line depth — number of items within a single line',
          'Product mix width — total number of different product lines offered',
          'SKU — stock keeping unit; a specific product variant (e.g. 12oz vs 24oz)'
        ]
      },
      { topic: 'product', title: 'Decreasing Line Depth', tag: 'Strategy',
        definition: 'Why companies trim their product portfolios.',
        points: [
          'Reduce consumer confusion from too many similar options',
          'Optimize shelf space and meet retailer demands',
          'Improve supply chain and manufacturing efficiency',
          'Focus resources on high-margin, high-turnover products',
          'Avoid cannibalization — new products stealing sales from existing ones'
        ]
      },
      { topic: 'product', title: 'Product Life Cycle', tag: 'Framework',
        definition: 'The four stages from launch to exit.',
        points: [
          'Introduction — low sales, high costs, losses typical',
          'Growth — rising sales and profits, new competitors enter',
          'Maturity — peak sales, intense competition, profit flattens',
          'Decline — falling sales, decisions about exit or harvest'
        ]
      },
      { topic: 'product', title: 'New Product Development', tag: '7 Stages',
        definition: 'The funnel from idea to market.',
        points: [
          'Strategy → Idea generation → Idea screening',
          'Business analysis → Development → Test marketing → Commercialization',
          'Each stage filters out weak ideas before the next investment',
          'Cannibalization risk assessed in the business analysis stage'
        ]
      },

      // ── Marketing Research ─────────────────────────────────────────
      { topic: 'research', title: '6-Step Research Process', tag: 'Process',
        definition: 'The systematic approach to solving marketing problems with data.',
        points: [
          '1. Define problem — distinguish symptoms from root causes',
          '2. Develop research plan — methods, sampling, instruments',
          '3. Collect data — primary and/or secondary',
          '4. Analyze data — find patterns and insights',
          '5. Present findings — communicate to decision-makers',
          '6. Make decision — act on insights'
        ]
      },
      { topic: 'research', title: 'Primary vs Secondary Research', tag: 'Data Types',
        definition: 'Two categories of data based on origin and purpose.',
        points: [
          'Primary — original data for this purpose: surveys, experiments, focus groups, ethnography',
          'Secondary — existing data from another purpose: company records, government data, syndicated reports',
          'Always exhaust secondary sources first (faster and cheaper)',
          'Primary is more specific but costly and time-consuming'
        ]
      },
      { topic: 'research', title: 'Qualitative vs Quantitative', tag: 'Research Types',
        definition: 'Two philosophies with different goals and outputs.',
        points: [
          'Qualitative — non-numerical, exploratory, depth of understanding',
          'Qual methods — focus groups (8–12 people), depth interviews, ethnography, projective techniques',
          'Quantitative — numerical, statistically projectable, confirms hypotheses',
          'Quant methods — surveys (online/phone/personal/mobile), experiments',
          'Rule of thumb — qualitative = why/how; quantitative = how many/much'
        ]
      },
      { topic: 'research', title: "McDonald's ADB Case", tag: 'Case Study',
        definition: 'How research corrected a wrong management assumption.',
        points: [
          'Symptoms — declining breakfast sales, longer wait times, bottlenecks',
          'Management assumed — menu fatigue (wrong)',
          'Research methods — surveys, focus groups, employee interviews, ethnography',
          'Actual insight — operational inefficiencies were the real problem',
          'Action — scaled back ADB, streamlined kitchen operations',
          'Result — sales stabilized, customer satisfaction improved'
        ]
      },
      { topic: 'research', title: 'Sampling &amp; Measurement', tag: 'Methods',
        definition: 'How researchers select participants and measure variables.',
        points: [
          'Probability sampling — random, stratified, cluster (allows statistical inference)',
          'Non-probability — convenience, judgment, quota, snowball',
          'Scales — nominal (categories), ordinal (rank), interval (equal gaps), ratio (true zero)',
          'Validity = measures what it should; reliability = consistent results',
          'Key tools — A/B testing, conjoint analysis, perceptual mapping'
        ]
      },
    ];

    // ── placeholder so remaining code that refs studyData still runs ──
    const studyData = {};


        // Quiz Logic
    let currentQuiz = null;
    let currentQuestion = 0;
    let score = 0;
    let userAnswers = [];

    document.getElementById('count').addEventListener('input', (e) => {
      document.getElementById('countValue').textContent = e.target.value;
    });

    async function generateQuiz() {
      const topic = document.getElementById('topic').value;
      const difficulty = document.getElementById('difficulty').value;
      const count = document.getElementById('count').value;

      document.getElementById('quizSetup').style.display = 'none';
      document.getElementById('quizContent').style.display = 'block';
      document.getElementById('quizError').style.display = 'none';
      document.getElementById('questionArea').innerHTML = '<div class="loading"><div class="spinner"></div><p>Generating questions...</p></div>';

      try {
        const response = await fetch('/api/quiz', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic, difficulty, count })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || 'Failed to generate quiz');
        }

        const data = await response.json();
        currentQuiz = data.questions;
        currentQuestion = 0;
        score = 0;
        userAnswers = [];
        showQuestion();
      } catch (err) {
        document.getElementById('quizError').textContent = 'Error: ' + err.message;
        document.getElementById('quizError').style.display = 'block';
        document.getElementById('quizSetup').style.display = 'block';
        document.getElementById('quizContent').style.display = 'none';
      }
    }

    function showQuestion() {
      if (!currentQuiz || currentQuestion >= currentQuiz.length) {
        showResults();
        return;
      }

      const q = currentQuiz[currentQuestion];
      const progress = ((currentQuestion + 1) / currentQuiz.length) * 100;
      document.getElementById('progressBar').style.width = progress + '%';

      let html = `
        <h2>Question ${currentQuestion + 1} of ${currentQuiz.length}</h2>
        <div class="question-container">
          <div class="question-text">${q.question}</div>
          <div class="choices">
      `;

      for (const [key, choice] of Object.entries(q.choices)) {
        html += `<div class="choice" onclick="selectAnswer('${key}')" data-choice="${key}">${key}. ${choice}</div>`;
      }

      html += `</div></div><div id="explanation" style="display: none;"></div>`;
      document.getElementById('questionArea').innerHTML = html;
    }

    function selectAnswer(choice) {
      const q = currentQuiz[currentQuestion];
      const isCorrect = choice === q.correct;

      if (isCorrect) score++;
      userAnswers.push({ question: q.question, userAnswer: choice, correct: q.correct, isCorrect, explanation: q.explanation, topic: q.topic });

      // Show feedback
      document.querySelectorAll('.choice').forEach(el => {
        el.classList.add('disabled');
        if (el.dataset.choice === q.correct) el.classList.add('correct');
        if (el.dataset.choice === choice && !isCorrect) el.classList.add('incorrect');
      });

      const explDiv = document.getElementById('explanation');
      explDiv.innerHTML = `<strong>${isCorrect ? 'Correct!' : 'Incorrect.'}</strong> ${q.explanation}`;
      explDiv.style.display = 'block';

      setTimeout(() => {
        currentQuestion++;
        showQuestion();
      }, 2500);
    }

    function showResults() {
      document.getElementById('questionArea').style.display = 'none';
      const percentage = (score / currentQuiz.length) * 100;
      let grade = 'F';
      if (percentage >= 90) grade = 'A';
      else if (percentage >= 80) grade = 'B';
      else if (percentage >= 70) grade = 'C';
      else if (percentage >= 60) grade = 'D';

      document.getElementById('gradeDisplay').textContent = grade;
      document.getElementById('scoreDisplay').textContent = `${score}/${currentQuiz.length}`;

      let reviewHtml = '<h3>Review</h3>';
      userAnswers.forEach((a, i) => {
        reviewHtml += `
          <div class="review-item">
            <div class="review-question">${i + 1}. ${a.question}</div>
            <div class="review-answer"><span class="your-answer">Your answer: ${a.userAnswer}</span></div>
            <div class="review-answer"><span class="correct-answer">Correct: ${a.correct}</span></div>
            <div class="review-answer">${a.explanation}</div>
            <div style="font-size: 12px; color: #666; margin-top: 0.5rem;">Topic: ${a.topic}</div>
          </div>
        `;
      });
      document.getElementById('reviewSection').innerHTML = reviewHtml;
      document.getElementById('resultsScreen').style.display = 'block';
    }

    function resetQuiz() {
      currentQuiz = null;
      document.getElementById('questionArea').style.display = 'block';
      document.getElementById('resultsScreen').style.display = 'none';
      document.getElementById('quizContent').style.display = 'none';
      document.getElementById('quizSetup').style.display = 'block';
    }

    // ── Study Guide Logic ─────────────────────────────────────────────

    const TOPIC_LABELS = { cb: 'Consumer Behavior', product: 'Product Management', research: 'Marketing Research' };

    function renderConceptCards(topic) {
      const filtered = topic === 'all' ? concepts : concepts.filter(c => c.topic === topic);

      if (topic === 'all') {
        // Group by topic with section labels
        const groups = ['cb', 'product', 'research'];
        return groups.map(t => {
          const group = concepts.filter(c => c.topic === t);
          return `
            <div class="topic-section-label">${TOPIC_LABELS[t]}</div>
            <div class="concept-card-grid">
              ${group.map(c => conceptCardHTML(c)).join('')}
            </div>`;
        }).join('');
      }

      return `<div class="concept-card-grid">${filtered.map(c => conceptCardHTML(c)).join('')}</div>`;
    }

    function conceptCardHTML(c) {
      return `
        <div class="concept-card">
          <div class="concept-card-header">
            <div class="concept-card-title">${c.title}</div>
            <div class="concept-card-tag">${c.tag}</div>
          </div>
          <div class="concept-card-def">${c.definition}</div>
          <ul class="concept-card-bullets">
            ${c.points.map(p => `<li>${p}</li>`).join('')}
          </ul>
        </div>`;
    }

    function updateStudyGuide() {
      const activeTopic = document.querySelector('.topic-btn.active').dataset.topic;
      document.getElementById('conceptCards').innerHTML = renderConceptCards(activeTopic);
    }

    document.querySelectorAll('.topic-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateStudyGuide();
      });
    });

    // Navigation
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        link.classList.add('active');
        const pageId = link.dataset.page;
        document.getElementById(pageId).classList.add('active');
        if (pageId === 'study') updateStudyGuide();
      });
    });

    // Init study guide on load
    updateStudyGuide();
  </script>
</body>
</html>
